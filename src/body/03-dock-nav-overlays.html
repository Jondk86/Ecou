<div id="kbwrap" hidden>
  <div id="kbbar">
    <button id="octDn" aria-label="Octave down">−</button>
    <button id="kbTrack" class="kbt" aria-label="Keyboard plays this track — tap to switch">Keys 1</button>
    <span id="oct">C4 – E5</span>
    <button id="octUp" aria-label="Octave up">+</button>
    <button id="kbToggle" aria-expanded="true" aria-controls="kb">Hide keys</button>
  </div>
  <div class="harm-badge" aria-live="polite"></div>
  <div id="kb" aria-label="Keyboard"></div>
</div>

<nav role="tablist" aria-label="Main">
  <button role="tab" aria-selected="false" data-nav="home"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></span>Home</button>
  <button role="tab" aria-selected="false" data-nav="play"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v9M15 4v9M3 13h18"/></svg></span>Play</button>
  <button role="tab" aria-selected="false" data-nav="sound"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg></span>Sound</button>
  <button role="tab" aria-selected="false" data-nav="song"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="9" height="4" rx="1.5"/><rect x="8" y="10.5" width="13" height="4" rx="1.5"/><rect x="3" y="16" width="7" height="4" rx="1.5"/></svg></span>Song</button>
  <button role="tab" aria-selected="false" data-nav="mix"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v16M12 4v16M18 4v16"/><rect x="3.5" y="13" width="5" height="3" rx="1" fill="currentColor"/><rect x="9.5" y="7" width="5" height="3" rx="1" fill="currentColor"/><rect x="15.5" y="15" width="5" height="3" rx="1" fill="currentColor"/></svg></span>Mix</button>
</nav>

<div id="take" role="dialog" aria-modal="true" aria-label="Take ready">
  <div class="row"><strong>Take ready</strong><span class="mu" id="takeLen"></span></div>
  <audio id="takeAudio" controls></audio>
  <div class="btns"><button class="btn primary" id="takeSave">Save WAV</button><button class="btn" id="takeDoc">Song Doctor</button><button class="btn" id="takeClose">Dismiss</button></div>
</div>
<div id="scoreOv" hidden role="dialog" aria-modal="true" aria-label="Score">
  <div class="row" style="padding:10px 14px;border-bottom:1px solid var(--ln)"><strong>Score</strong><div class="row" style="gap:8px"><button class="btn" id="scorePdf2" style="min-height:40px">Export PDF</button><button class="btn" id="scoreClose" style="min-height:40px">Close</button></div></div>
  <div id="scorePaper"><div id="scoreInner"></div></div>
</div>
<div id="scorePrint" aria-hidden="true"></div>
<button id="micOn" hidden aria-label="Microphone is on — tap to turn it off">🎙 Mic on — tap to release</button>
<button id="sndOff" hidden>🔇 Sound is paused — tap here to turn it on</button>
